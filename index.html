<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Изучение JavaScript</title>
  <script type="module" src="./script.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="catalog">
  <h1>Каталог товаров</h1>

  <form id="filter-form" >
    <label for="search-query">Название товара</label>
    <input id="search-query" type="text">

    <label for="max-price">Максимальная цена, ₽</label>
    <input id="max-price" type="number" min="0" value="1500">
    <div class="stock-option">
    <label for="only-in-stock">Только в наличии</label>
    <input id="only-in-stock" type="checkbox" checked>
    <label for="apply-discount">Скидка 10%</label>
    <input id="apply-discount" type="checkbox">
    </div>
    <button id="show-affordable" type="submit">
      Применить бюджет
    </button>
    <label for="sort-order">Сортировка</label>
    <select id="sort-order">
      <option value="default">Исходный порядок</option>
      <option value="asc">Сначала дешевые</option>
      <option value="desc">Сначала Дорогие</option>
    </select>
  </form>

  <button id="all-button" type="button">
    Показать все товары
  </button>

  <p id="catalog-status">Загрузка каталога…</p>
  <ul id="product-list"></ul>
</main>
</body>
</html>
